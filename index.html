<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI 工具箱 — 整理 AI 連結與實用資源">
    <title>AI 工具箱</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header"><div class="header-inner"><div class="logo"><span class="logo-icon">🧠</span><h1>AI 工具箱</h1></div><p class="subtitle">公開收藏 · 大家都能新增 · 管理密碼保護刪除</p></div></header>
    <div class="toolbar">
        <div class="toolbar-row"><div class="search-box"><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="search" id="search-input" placeholder="搜尋工具名稱、標籤、備註…" autocomplete="off"><button type="button" class="search-clear hidden" id="search-clear" aria-label="清除搜尋">×</button></div><button type="button" class="btn-add" id="btn-add">＋ 新增工具</button></div>
        <div class="toolbar-tools"><div class="view-tabs" id="view-tabs" role="tablist" aria-label="工具篩選"></div><div class="data-actions"><button type="button" class="btn btn-secondary btn-small" id="btn-export">匯出備份</button><button type="button" class="btn btn-secondary btn-small" id="btn-import">匯入備份</button><input type="file" id="import-file" accept="application/json,.json" hidden></div></div>
        <div class="category-tabs" id="category-tabs"></div>
    </div>
    <main class="main" id="main-content"></main>

    <div class="modal-overlay hidden" id="detail-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title">工具詳情</h2><button type="button" class="modal-close" id="detail-close" aria-label="關閉">✕</button></div><form id="detail-form" class="modal-body"><input type="hidden" id="detail-id"><input type="hidden" id="detail-category-id"><input type="hidden" id="detail-subcategory"><label class="field"><span>名稱</span><input type="text" id="detail-name" required></label><label class="field"><span>網址</span><input type="url" id="detail-url" placeholder="https://"></label><label class="field"><span>標籤（以逗號分隔）</span><input type="text" id="detail-tags" placeholder="例：免費, 圖庫"></label><label class="field"><span>備註</span><textarea id="detail-note" rows="3" placeholder="使用說明或備忘…"></textarea></label><div class="modal-actions"><button type="button" class="btn btn-danger" id="detail-delete">刪除工具</button><div class="modal-actions-right"><button type="button" class="btn btn-secondary" id="detail-cancel">取消</button><button type="submit" class="btn btn-primary">儲存</button><a class="btn btn-accent hidden" id="detail-visit" href="#" target="_blank" rel="noopener">前往網站 ↗</a></div></div></form></div></div>

    <div class="modal-overlay hidden" id="add-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="add-modal-title"><div class="modal-header"><h2 id="add-modal-title">新增工具</h2><button type="button" class="modal-close" id="add-close" aria-label="關閉">✕</button></div><form id="add-form" class="modal-body"><label class="field"><span>分類</span><select id="add-category" required></select></label><label class="field hidden" id="add-subcategory-field"><span>子分類</span><select id="add-subcategory"></select></label><label class="field"><span>名稱</span><input type="text" id="add-name" required placeholder="工具名稱"></label><label class="field"><span>網址</span><input type="url" id="add-url" placeholder="https://"></label><label class="field"><span>標籤（以逗號分隔）</span><input type="text" id="add-tags" placeholder="例：免費, 圖庫"></label><label class="field"><span>備註</span><textarea id="add-note" rows="3" placeholder="使用說明或備忘…"></textarea></label><div class="modal-actions"><div></div><div class="modal-actions-right"><button type="button" class="btn btn-secondary" id="add-cancel">取消</button><button type="submit" class="btn btn-primary">新增</button></div></div></form></div></div>

    <div class="modal-overlay hidden" id="password-modal"><div class="modal password-modal" role="dialog" aria-modal="true" aria-labelledby="password-title"><div class="modal-header"><h2 id="password-title">管理員驗證</h2><button type="button" class="modal-close" id="password-close" aria-label="關閉">✕</button></div><form id="password-form" class="modal-body"><p class="password-hint">刪除工具前請輸入管理密碼。此密碼只用於防止誤刪。</p><label class="field"><span>管理密碼</span><input type="password" id="delete-password" autocomplete="current-password" required></label><p class="form-error hidden" id="password-error">密碼不正確，請再試一次。</p><div class="modal-actions"><div></div><div class="modal-actions-right"><button type="button" class="btn btn-secondary" id="password-cancel">取消</button><button type="submit" class="btn btn-danger">確認刪除</button></div></div></form></div></div>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"><span id="toast-message"></span><button type="button" class="toast-action hidden" id="toast-action">復原</button></div><footer class="footer"><p id="storage-status">資料載入中…</p></footer>
    <script src="supabase-config.js"></script><script src="data.js"></script><script src="script.js"></script>
</body>
</html>
